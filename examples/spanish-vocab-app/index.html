<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Vocabulary Learner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .nav-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: #667eea;
            background: white;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 30px 20px;
            min-height: 400px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Settings Banner */
        .settings-banner {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }

        .settings-banner h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #667eea;
        }

        .batch-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .batch-btn {
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .batch-btn:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .batch-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .batch-info {
            font-size: 14px;
            color: #6c757d;
            text-align: center;
        }

        .batch-info strong {
            color: #667eea;
        }

        /* Flashcard Styles */
        .flashcard {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 60px 30px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard.flipped {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .word-spanish {
            font-size: 42px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        .word-english {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 15px;
        }

        .word-example {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
            margin-top: 10px;
            line-height: 1.5;
        }

        .tap-hint {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
        }

        .pronounce-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pronounce-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .pronounce-btn:active {
            transform: translateY(0);
        }

        .card-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-correct {
            background: #10b981;
            color: white;
        }

        .btn-correct:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-incorrect {
            background: #ef4444;
            color: white;
        }

        .btn-incorrect:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        /* Reading Practice Styles */
        .reading-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .sentence-spanish {
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
        }

        .highlight {
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #92400e;
        }

        .question {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 15px;
            color: #667eea;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: #10b981;
        }

        .option-btn.incorrect {
            background: #fee2e2;
            border-color: #ef4444;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d1fae5;
            color: #065f46;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Progress Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .progress-section {
            margin-top: 30px;
        }

        .progress-section h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .word-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-info {
            flex: 1;
        }

        .word-info strong {
            color: #667eea;
            font-size: 16px;
        }

        .word-info span {
            color: #6c757d;
            font-size: 14px;
            margin-left: 10px;
        }

        .word-progress {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            width: 100px;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.3s;
        }

        .reset-btn {
            margin-top: 20px;
            padding: 12px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .reset-btn:hover {
            background: #dc2626;
        }

        @media (max-width: 600px) {
            .word-spanish {
                font-size: 32px;
            }

            .word-english {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .batch-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇪🇸 Spanish Vocabulary</h1>
            <p>Learn 1000+ Spanish words with flashcards and context</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchView('flashcards')">Flashcards</button>
            <button class="nav-tab" onclick="switchView('reading')">Reading</button>
            <button class="nav-tab" onclick="switchView('progress')">Progress</button>
        </div>

        <div class="content">
            <!-- Flashcards View -->
            <div id="flashcards-view" class="view active">
                <div class="settings-banner">
                    <h3>📚 Study Batch Size</h3>
                    <div class="batch-selector">
                        <button class="batch-btn" onclick="setBatchSize(25)">25</button>
                        <button class="batch-btn active" onclick="setBatchSize(50)">50</button>
                        <button class="batch-btn" onclick="setBatchSize(100)">100</button>
                        <button class="batch-btn" onclick="setBatchSize(0)">All</button>
                    </div>
                    <div class="batch-info">
                        Studying <strong id="current-batch-info">words 1-50</strong> of 1000+
                    </div>
                </div>

                <div id="flashcard" class="flashcard" onclick="flipCard()">
                    <div class="word-spanish" id="card-spanish"></div>
                    <div class="word-english" id="card-english" style="display: none;"></div>
                    <div class="word-example" id="card-example" style="display: none;"></div>
                    <div class="word-example" id="card-translation" style="display: none; opacity: 0.85;"></div>
                    <button class="pronounce-btn" id="pronounce-btn" style="display: none;" onclick="pronounceWord(event)">
                        🔊 Pronounce
                    </button>
                    <button class="pronounce-btn" id="translate-btn" style="display: none;" onclick="toggleTranslation(event)">
                        🌐 Translation
                    </button>
                    <div class="tap-hint">Tap to reveal</div>
                </div>
                <div class="card-buttons" id="card-buttons" style="display: none;">
                    <button class="btn btn-incorrect" onclick="rateCard(false)">Need Practice</button>
                    <button class="btn btn-correct" onclick="rateCard(true)">Got It!</button>
                </div>
            </div>

            <!-- Reading Practice View -->
            <div id="reading-view" class="view">
                <div class="reading-card">
                    <div class="sentence-spanish" id="reading-sentence"></div>
                    <div class="question">What does the highlighted word mean?</div>
                    <div class="options" id="reading-options"></div>
                    <div class="feedback" id="reading-feedback"></div>
                    <div class="feedback" id="sentence-translation" style="background: #e0f2fe; color: #075985; margin-top: 15px;"></div>
                </div>
                <button class="btn btn-primary" onclick="nextReading()" style="width: 100%;">Next Sentence</button>
            </div>

            <!-- Progress View -->
            <div id="progress-view" class="view">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="total-studied">0</div>
                        <div class="stat-label">Words Studied</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="mastered">0</div>
                        <div class="stat-label">Mastered</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="correct-rate">0%</div>
                        <div class="stat-label">Accuracy</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="streak">0</div>
                        <div class="stat-label">Day Streak</div>
                    </div>
                </div>

                <div class="progress-section">
                    <h3>Your Vocabulary Progress</h3>
                    <div class="word-list" id="word-progress-list"></div>
                </div>

                <button class="reset-btn" onclick="resetProgress()">Reset All Progress</button>
            </div>
        </div>
    </div>

    <script src="vocabulary.js"></script>
    <script>
        // State
        let currentCard = null;
        let isFlipped = false;
        let showTranslation = false;
        let currentReading = null;
        let userProgress = {};
        let batchSize = 50;
        let currentBatchStart = 0;
        let currentBatchWords = [];

        // Text-to-Speech
        let speechSynthesis = window.speechSynthesis;
        let spanishVoice = null;

        // Initialize
        function init() {
            loadVoices();
            loadProgress();
            updateCurrentBatch();
            loadFlashcard();
            loadReading();
            updateProgressView();
        }

        // Load Spanish voice for pronunciation
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            // Try to find a Spanish voice
            spanishVoice = voices.find(voice =>
                voice.lang.startsWith('es')
            ) || voices[0]; // Fallback to first voice if no Spanish found

            // Some browsers load voices asynchronously
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
        }

        // Pronounce word
        function pronounceWord(event) {
            event.stopPropagation(); // Prevent card flip

            if (!currentCard) return;

            // Cancel any ongoing speech
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(currentCard.spanish);
            utterance.lang = 'es-ES';
            utterance.rate = 0.8; // Slightly slower for learning

            if (spanishVoice) {
                utterance.voice = spanishVoice;
            }

            speechSynthesis.speak(utterance);
        }

        // Batch Management
        function setBatchSize(size) {
            batchSize = size;
            currentBatchStart = 0;

            // Update UI
            document.querySelectorAll('.batch-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            updateCurrentBatch();
            loadFlashcard();
            updateBatchInfo();
        }

        function updateCurrentBatch() {
            if (batchSize === 0) {
                // Study all words
                currentBatchWords = [...vocabulary];
            } else {
                // Get current batch
                currentBatchWords = vocabulary.slice(currentBatchStart, currentBatchStart + batchSize);
            }
        }

        function updateBatchInfo() {
            const info = document.getElementById('current-batch-info');
            if (batchSize === 0) {
                info.innerHTML = `all <strong>${vocabulary.length}</strong> words`;
            } else {
                const end = Math.min(currentBatchStart + batchSize, vocabulary.length);
                info.innerHTML = `words <strong>${currentBatchStart + 1}-${end}</strong> of ${vocabulary.length}`;
            }
        }

        function nextBatch() {
            currentBatchStart += batchSize;
            if (currentBatchStart >= vocabulary.length) {
                currentBatchStart = 0; // Loop back to start
            }
            updateCurrentBatch();
            updateBatchInfo();
            loadFlashcard();
        }

        function previousBatch() {
            currentBatchStart -= batchSize;
            if (currentBatchStart < 0) {
                currentBatchStart = Math.floor(vocabulary.length / batchSize) * batchSize;
            }
            updateCurrentBatch();
            updateBatchInfo();
            loadFlashcard();
        }

        // Local Storage
        function loadProgress() {
            const saved = localStorage.getItem('spanishVocabProgress');
            if (saved) {
                userProgress = JSON.parse(saved);
            }

            // Initialize progress for any new words
            vocabulary.forEach(word => {
                if (!userProgress[word.id]) {
                    userProgress[word.id] = {
                        correct: 0,
                        incorrect: 0,
                        lastReviewed: null,
                        nextReview: Date.now(),
                        interval: 0
                    };
                }
            });

            saveProgress();
        }

        function saveProgress() {
            localStorage.setItem('spanishVocabProgress', JSON.stringify(userProgress));
        }

        // View Switching
        function switchView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            document.getElementById(`${view}-view`).classList.add('active');
            event.target.classList.add('active');

            if (view === 'progress') {
                updateProgressView();
            }
        }

        // Flashcard Functions
        function loadFlashcard() {
            // Get words due for review using spaced repetition from current batch
            const dueWords = currentBatchWords.filter(word => {
                const progress = userProgress[word.id];
                return progress.nextReview <= Date.now();
            });

            if (dueWords.length === 0) {
                // If no words due in batch, pick a random word from batch
                if (currentBatchWords.length > 0) {
                    currentCard = currentBatchWords[Math.floor(Math.random() * currentBatchWords.length)];
                } else {
                    // No words in batch, use all vocabulary
                    currentCard = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                }
            } else {
                // Pick from due words
                currentCard = dueWords[Math.floor(Math.random() * dueWords.length)];
            }

            isFlipped = false;
            showTranslation = false;
            document.getElementById('card-spanish').textContent = currentCard.spanish;
            document.getElementById('card-english').style.display = 'none';
            document.getElementById('card-example').style.display = 'none';
            document.getElementById('card-translation').style.display = 'none';
            document.getElementById('card-buttons').style.display = 'none';
            document.getElementById('pronounce-btn').style.display = 'none';
            document.getElementById('translate-btn').style.display = 'none';
            document.querySelector('.tap-hint').style.display = 'block';
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() {
            if (!isFlipped) {
                isFlipped = true;
                showTranslation = false;
                document.getElementById('card-english').textContent = currentCard.english;
                document.getElementById('card-example').textContent = currentCard.example;
                document.getElementById('card-english').style.display = 'block';
                document.getElementById('card-example').style.display = 'block';
                document.getElementById('card-translation').style.display = 'none';
                document.getElementById('card-buttons').style.display = 'flex';
                document.getElementById('pronounce-btn').style.display = 'inline-flex';
                document.getElementById('translate-btn').style.display = 'inline-flex';
                document.querySelector('.tap-hint').style.display = 'none';
                document.getElementById('flashcard').classList.add('flipped');
            }
        }

        function toggleTranslation(event) {
            event.stopPropagation(); // Prevent card flip

            showTranslation = !showTranslation;
            const exampleEl = document.getElementById('card-example');
            const translationEl = document.getElementById('card-translation');

            if (showTranslation) {
                exampleEl.style.display = 'none';
                translationEl.textContent = currentCard.translation;
                translationEl.style.display = 'block';
            } else {
                exampleEl.style.display = 'block';
                translationEl.style.display = 'none';
            }
        }

        function rateCard(correct) {
            const progress = userProgress[currentCard.id];
            progress.lastReviewed = Date.now();

            if (correct) {
                progress.correct++;
                // Increase interval using modified SM-2 algorithm
                if (progress.interval === 0) {
                    progress.interval = 1;
                } else if (progress.interval === 1) {
                    progress.interval = 6;
                } else {
                    progress.interval = Math.round(progress.interval * 2.5);
                }
            } else {
                progress.incorrect++;
                // Reset interval
                progress.interval = 0;
            }

            // Calculate next review date
            progress.nextReview = Date.now() + (progress.interval * 24 * 60 * 60 * 1000);

            saveProgress();
            loadFlashcard();
        }

        // Reading Practice Functions
        function loadReading() {
            // Pick a random word with an example sentence from current batch
            const wordsWithExamples = (currentBatchWords.length > 0 ? currentBatchWords : vocabulary)
                .filter(w => w.example);

            if (wordsWithExamples.length === 0) return;

            currentReading = wordsWithExamples[Math.floor(Math.random() * wordsWithExamples.length)];

            // Highlight the word in the sentence - escape special regex characters and use word boundaries
            const escapeRegex = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const escapedWord = escapeRegex(currentReading.spanish);

            // Try to find the exact word first, then try without word boundaries if not found
            let sentence = currentReading.example;
            const exactMatch = new RegExp(`\\b${escapedWord}\\b`, 'gi');
            const anyMatch = new RegExp(escapedWord, 'gi');

            if (exactMatch.test(sentence)) {
                sentence = sentence.replace(exactMatch, match => `<span class="highlight">${match}</span>`);
            } else {
                sentence = sentence.replace(anyMatch, match => `<span class="highlight">${match}</span>`);
            }

            document.getElementById('reading-sentence').innerHTML = sentence;

            // Generate options (correct answer + 3 random wrong answers)
            const options = [currentReading.english];
            const wrongOptions = vocabulary
                .filter(w => w.id !== currentReading.id)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(w => w.english);

            options.push(...wrongOptions);
            options.sort(() => 0.5 - Math.random());

            // Display options
            const optionsContainer = document.getElementById('reading-options');
            optionsContainer.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkReading(option);
                optionsContainer.appendChild(btn);
            });

            // Reset feedback and translation
            document.getElementById('reading-feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('sentence-translation').classList.remove('show');
        }

        function checkReading(selected) {
            const correct = selected === currentReading.english;
            const feedback = document.getElementById('reading-feedback');
            const translation = document.getElementById('sentence-translation');
            const buttons = document.querySelectorAll('.option-btn');

            // Disable all buttons
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === currentReading.english) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selected && !correct) {
                    btn.classList.add('incorrect');
                }
            });

            // Show feedback
            feedback.classList.add('show', correct ? 'correct' : 'incorrect');
            feedback.textContent = correct
                ? `Correct! "${currentReading.spanish}" means "${currentReading.english}".`
                : `Not quite. "${currentReading.spanish}" means "${currentReading.english}".`;

            // Show full sentence translation
            translation.classList.add('show');
            translation.innerHTML = `<strong>Full translation:</strong> "${currentReading.translation}"`;

            // Update progress
            const progress = userProgress[currentReading.id];
            if (correct) {
                progress.correct++;
            } else {
                progress.incorrect++;
            }
            saveProgress();
        }

        function nextReading() {
            loadReading();
        }

        // Progress View Functions
        function updateProgressView() {
            let totalStudied = 0;
            let mastered = 0;
            let totalCorrect = 0;
            let totalAttempts = 0;

            Object.keys(userProgress).forEach(id => {
                const progress = userProgress[id];
                const attempts = progress.correct + progress.incorrect;
                if (attempts > 0) {
                    totalStudied++;
                    totalCorrect += progress.correct;
                    totalAttempts += attempts;

                    // Consider mastered if correct rate > 80% and reviewed at least 5 times
                    if (attempts >= 5 && (progress.correct / attempts) > 0.8) {
                        mastered++;
                    }
                }
            });

            const correctRate = totalAttempts > 0
                ? Math.round((totalCorrect / totalAttempts) * 100)
                : 0;

            document.getElementById('total-studied').textContent = totalStudied;
            document.getElementById('mastered').textContent = mastered;
            document.getElementById('correct-rate').textContent = correctRate + '%';

            // Calculate streak (simplified - just show total days with activity)
            const streak = totalStudied > 0 ? Math.ceil(totalStudied / 10) : 0;
            document.getElementById('streak').textContent = streak;

            // Display word progress
            const wordList = document.getElementById('word-progress-list');
            wordList.innerHTML = '';

            // Sort words by total attempts (most practiced first)
            const sortedWords = vocabulary
                .map(word => ({
                    ...word,
                    progress: userProgress[word.id]
                }))
                .filter(w => (w.progress.correct + w.progress.incorrect) > 0)
                .sort((a, b) => {
                    const aTotal = a.progress.correct + a.progress.incorrect;
                    const bTotal = b.progress.correct + b.progress.incorrect;
                    return bTotal - aTotal;
                })
                .slice(0, 50); // Show top 50

            if (sortedWords.length === 0) {
                wordList.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px;">Start studying to see your progress here!</p>';
            } else {
                sortedWords.forEach(word => {
                    const total = word.progress.correct + word.progress.incorrect;
                    const accuracy = Math.round((word.progress.correct / total) * 100);

                    const item = document.createElement('div');
                    item.className = 'word-item';
                    item.innerHTML = `
                        <div class="word-info">
                            <strong>${word.spanish}</strong>
                            <span>${word.english}</span>
                        </div>
                        <div class="word-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${accuracy}%"></div>
                            </div>
                            <span style="font-size: 14px; color: #6c757d;">${accuracy}%</span>
                        </div>
                    `;
                    wordList.appendChild(item);
                });
            }
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset all your progress? This cannot be undone.')) {
                localStorage.removeItem('spanishVocabProgress');
                userProgress = {};
                vocabulary.forEach(word => {
                    userProgress[word.id] = {
                        correct: 0,
                        incorrect: 0,
                        lastReviewed: null,
                        nextReview: Date.now(),
                        interval: 0
                    };
                });
                saveProgress();
                updateProgressView();
                alert('Progress reset successfully!');
            }
        }

        // Initialize app
        window.addEventListener('DOMContentLoaded', init);
        updateBatchInfo();
    </script>
</body>
</html>
